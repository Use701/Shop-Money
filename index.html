<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Money</title>

<style>
#unlockBtn {
    position: fixed;
    opacity: 0; /* invisible */
    width: 100px;
    height: 40px;
}
</style>

</head>
<body>

<h1>Money: <span id="money">0</span></h1>

<button id="unlockBtn" onclick="unlock()">🔓Unlock</button>
<button onclick="increase()">+</button>
<button onclick="decrease()">-</button>

<script>
let money = Number(localStorage.getItem("money")) || 0;

let unlocked = false;
let unlockTimer = null;

const A = "😡";
const B = "😈";

const C = "😂";

const D = "😭";

const E = "😎";

const F = "🥶";

const G = "🤡";

const H = "👻";

const I = "💀";

const J = "😺";

const K = "🐸";

const L = "🦊";

const M = "🐵";

const N = "🧠";

const O = "🔥";

const P = "⚡";

const Q = "🤮";

const R = "🫆";

const S = "⭐";

const T = "🌙";

const U = "☠️";

const V = "🧊";

const W = "🍀";

const X = "🪐";

const Y = "🎯";

const Z = "👁️";

const Secretcode = P;

const secretCode = R;

const secretcode = V;

let wrongAttempts = Number(localStorage.getItem("wrongAttempts")) || 0;
let lockUntil = Number(localStorage.getItem("lockUntil")) || 0;

function isLocked() {
    return Date.now() < lockUntil;
}

function showRedScreen(msg) {
    document.body.innerHTML = `
        <div style="
            position:fixed;
            inset:0;
            background:red;
            color:white;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            font-family:Arial;
            font-size:40px;
            text-align:center;
        ">
            <h1>⚠ ACCESS DENIED ⚠</h1>
            <p>${msg}</p>
        </div>
    `;
}

function updateMoney() {
    const el = document.getElementById("money");
    if (el) el.textContent = money;
}

function randomizeUnlockButton() {
    const btn = document.getElementById("unlockBtn");

    const maxX = window.innerWidth - 100;
    const maxY = window.innerHeight - 40;

    btn.style.left = Math.random() * maxX + "px";
    btn.style.top = Math.random() * maxY + "px";
}

window.onload = function() {
    updateMoney();
    randomizeUnlockButton();
};

function unlock() {
    if (isLocked()) {
        showRedScreen("Locked for 30 minutes!");
        return;
    }

    let code = prompt("Enter secret code:");

    if (code !== secretCode) {
        wrongAttempts++;
        localStorage.setItem("wrongAttempts", wrongAttempts);

        if (wrongAttempts >= 2) {
            lockUntil = Date.now() + 30 * 60 * 1000;
            localStorage.setItem("lockUntil", lockUntil);

            wrongAttempts = 0;
            localStorage.setItem("wrongAttempts", 0);

            showRedScreen("Too many wrong attempts! Locked for 30 minutes.");
        }
        return;
    }

    wrongAttempts = 0;
    localStorage.setItem("wrongAttempts", 0);

    unlocked = true;
    alert("Unlocked for 10 seconds!");

    clearTimeout(unlockTimer);

    unlockTimer = setTimeout(() => {
        unlocked = false;
        alert("Lock expired");
    }, 10000);
}

function increase() {
    if (!unlocked) return showRedScreen("Click unlock first!");
    money++;
    save();
}

function decrease() {
    if (!unlocked) return showRedScreen("Click unlock first!");
    money--;
    save();
}

function save() {
    updateMoney();
    localStorage.setItem("money", money);
}
</script>

</body>
</html>
