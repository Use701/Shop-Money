<script>
(() => {

function start(){

if (!window.firebase) {
console.error("Firebase missing");
return;
}

firebase.initializeApp({
apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
databaseURL:"https://YOUR_PROJECT-default-rtdb.firebaseio.com",
projectId:"YOUR_PROJECT"
});

const auth = firebase.auth();
const db = firebase.database();

const moneyEl = document.getElementById("money");
const warnEl = document.getElementById("warningScreen");

if (!moneyEl || !warnEl) {
console.error("Missing HTML elements");
return;
}

let unlocked = 0;
let failed = 0;
let seq = [];
let gate = 0;
let lockUntil = 0;

const order = ["tiger","tiger","elephant"];
const map = {tiger:"t",monkey:"m",elephant:"e",giraffe:"g"};
const PASS = "MONKEY";

/* NEVER blank screen */
moneyEl.textContent = "0";

auth.signInAnonymously().then(user => {

const ref = db.ref("shopMoney/" + user.user.uid);

/* init */
ref.once("value", s => {
if (s.val() === null) ref.set(0);
});

/* live update */
ref.on("value", s => {
moneyEl.textContent = s.val() || 0;
});

const warn = () => {
warnEl.style.display = "flex";
setTimeout(() => warnEl.style.display = "none", 1200);
};

const locked = () => Date.now() < lockUntil;

const lockScreen = () => {
document.body.innerHTML =
`<div style="position:fixed;inset:0;background:black;color:red;display:flex;align-items:center;justify-content:center;font-size:28px">
LOCKED FOR 30 MINUTES
</div>`;
};

window.increase = () => {
if (locked()) return lockScreen();
if (!unlocked) return warn();
ref.transaction(v => (v || 0) + 1);
};

window.decrease = () => {
if (locked()) return lockScreen();
if (!unlocked) return warn();
ref.transaction(v => (v || 0) - 1);
};

window.animalClick = (a) => {
if (locked()) return lockScreen();
if (failed || unlocked || gate) return;

if (map[a] !== order[seq.length]) return failed = 1;

seq.push(map[a]);

if (seq.length === order.length) {

gate = 1;

const btn = document.createElement("button");
btn.style.cssText =
"position:fixed;width:60px;height:60px;opacity:0;z-index:99999";

document.body.appendChild(btn);

btn.style.display = "block";
btn.style.left = Math.random() * (innerWidth - 60) + "px";
btn.style.top = Math.random() * (innerHeight - 60) + "px";

btn.onclick = () => {
const input = prompt("Enter code:");

if (input === PASS) {
unlocked = 1;
gate = 0;
btn.style.display = "none";

setTimeout(() => unlocked = 0, 10000);

} else {
lockUntil = Date.now() + 1800000;
lockScreen();
}
};

}

});

}

/* wait for page */
if (document.readyState === "loading") {
document.addEventListener("DOMContentLoaded", start);
} else {
start();
}

})();
</script>
