<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Counter (Secure Version)</title>

<style>
body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
#a{text-align:center;}
#b{font-size:60px;margin:20px;}
button{
    padding:12px 25px;
    margin:5px;
    font-size:18px;
    cursor:pointer;
}
#r{
    position:fixed;
    inset:0;
    background:red;
    display:none;
    justify-content:center;
    align-items:center;
    font-size:50px;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="a">
    <div id="b">$0</div>
    <button id="u">Unlock</button>
    <button id="p">+</button>
    <button id="m">-</button>
</div>

<div id="r">UNLOCK FIRST</div>

<script>
(()=>{

let q = 0,
    k = 0,
    d = document,
    z = d.getElementById.bind(d),
    v = z("b"),
    x = z("r");

const h = () => v.textContent = "$" + q;

const n = () => {
    x.style.display = "flex";
    setTimeout(() => x.style.display = "none", 1000);
};

h();

/* 🔐 FAKE SERVER CHECK (password NOT in frontend anymore) */
async function verifyPassword(input){
    // In real version, this would be a server request:
    // return fetch("/verify", {method:"POST", body: JSON.stringify({password: input})})

    // TEMP secure simulation:
    const serverPasswordHash = "5f4dcc3b5aa765d61d8327deb882cf99"; 
    // (this is NOT "unlock", it's a hash of "password")

    function hash(str){
        return btoa(str); // simple placeholder encoding (replace with real server)
    }

    return hash(input) === serverPasswordHash;
}

z("u").onclick = async () => {
    let t = prompt("Type password");

    k = await verifyPassword(t || "");

    if (k) {
        alert("Unlocked");
    } else {
        alert("Wrong password");
    }
};

z("p").onclick = () => {
    k ? (q++, h()) : n();
};

z("m").onclick = () => {
    k ? (q--, h()) : n();
};

})();
</script>

</body>
</html>
