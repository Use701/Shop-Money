<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Money Game</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    overflow: hidden;
    color: white;
    background: linear-gradient(to bottom, #1db954, #0b6623);
}

/* ===== ANIMALS ===== */
.animal-btn {
    position: fixed;
    background: transparent;
    border: none;
    font-size: 90px;
    cursor: pointer;
    z-index: 2;
}

#giraffe { top: 20px; right: 20px; font-size: 150px; }
#monkey { top: 80px; left: 80px; }
#elephant { bottom: 20px; left: 20px; font-size: 130px; }
#tiger { bottom: 50px; right: 120px; font-size: 110px; }

/* 🍌 */
#banana {
    position: fixed;
    top: 120px;
    left: 140px;
    font-size: 40px;
}

/* ===== UI ===== */
.center {
    position: relative;
    z-index: 5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

.money-controls {
    display: flex;
    gap: 10px;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.action {
    background: #2ecc71;
    color: white;
}

/* ===== INVISIBLE UNLOCK BUTTON ===== */
#unlockBtn {
    position: fixed;
    width: 80px;
    height: 40px;
    opacity: 0;
    z-index: 10;
    display: none;
}
</style>
</head>

<body>

<!-- 🐾 ANIMALS -->
<button id="tiger" class="animal-btn" onclick="animalClick('tiger')">🐯</button>
<button id="elephant" class="animal-btn" onclick="animalClick('elephant')">🐘</button>
<button id="giraffe" class="animal-btn" onclick="animalClick('giraffe')">🦒</button>

<div id="banana">🍌</div>

<!-- UI -->
<div class="center">

    <h1>💰 Shop Money: <span id="money">0</span></h1>

    <div class="money-controls">
        <button onclick="increase()" class="action">+</button>
        <button onclick="decrease()" class="action">-</button>
    </div>

</div>

<!-- hidden unlock -->
<button id="unlockBtn" onclick="unlockClick()"></button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getDatabase,
  ref,
  onValue,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const moneyRef = ref(db, "money");

/* ===== STATE ===== */
let unlocked = false;
let lockUntil = 0;
let wrongAttempts = 0;

/* ===== SEQUENCE ===== */
const correctOrder = ["tiger", "elephant", "giraffe"];
let playerOrder = [];

/* ===== RED SCREEN ===== */
function showRedScreen(msg) {
    document.body.innerHTML = `
        <div style="
            position:fixed;
            inset:0;
            background:red;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:40px;
            font-family:Arial;
            text-align:center;
        ">
        ⚠ ${msg}
        </div>
    `;
}

/* ===== MONEY ===== */
onValue(moneyRef, (snap) => {
    document.getElementById("money").textContent = snap.val() || 0;
});

/* ===== + - ===== */
window.increase = function () {
    if (!unlocked) return showRedScreen("Unlock first!");
    runTransaction(moneyRef, v => (v || 0) + 1);
};

window.decrease = function () {
    if (!unlocked) return showRedScreen("Unlock first!");
    runTransaction(moneyRef, v => (v || 0) - 1);
};

/* ===== ANIMAL ORDER ===== */
window.animalClick = function (animal) {

    playerOrder.push(animal);

    let i = playerOrder.length - 1;

    if (playerOrder[i] !== correctOrder[i]) {
        playerOrder = [];
        alert("❌ Wrong order! Restart!");
        return;
    }

    if (playerOrder.length === correctOrder.length) {
        const btn = document.getElementById("unlockBtn");
        btn.style.display = "block";

        // ✅ RANDOM POSITION ONLY ONCE
        const x = Math.random() * (window.innerWidth - 80);
        const y = Math.random() * (window.innerHeight - 40);

        btn.style.left = x + "px";
        btn.style.top = y + "px";

        alert("✅ Correct order! Unlock button appeared!");
    }
};

/* ===== LOCK CHECK ===== */
function isLocked() {
    return Date.now() < lockUntil;
}

/* ===== UNLOCK ===== */
window.unlockClick = function () {

    if (isLocked()) {
        showRedScreen("Locked for 30 minutes!");
        return;
    }

    let code = prompt("Enter password:");

    if (code !== "🫆") {
        wrongAttempts++;

        if (wrongAttempts >= 1) {
            lockUntil = Date.now() + 30 * 60 * 1000;
            wrongAttempts = 0;
            showRedScreen("Wrong password! Locked 30 minutes.");
        }
        return;
    }

    unlocked = true;
    alert("Unlocked for 10 seconds!");

    setTimeout(() => unlocked = false, 10000);
};
</script>

</body>
</html>
