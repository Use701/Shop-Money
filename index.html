<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Money Game</title>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    overflow: hidden;
    color: white;
    background: linear-gradient(to bottom, #1db954, #0b6623);
}

.animal-btn {
    position: fixed;
    background: transparent;
    border: none;
    font-size: 110px;
    cursor: pointer;
    z-index: 9999;
    user-select: none;
}

.elephant { bottom: 20px; left: 20px; }
.monkey { top: 20px; left: 20px; font-size: 90px; }
.giraffe { top: 20px; right: 20px; font-size: 140px; }
.tiger { bottom: 20px; right: 20px; }

.center {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

.money-controls {
    display: flex;
    gap: 10px;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.action {
    background: #2ecc71;
    color: white;
}

#warningScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: red;
    color: white;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: bold;
    z-index: 99999;
}
</style>
</head>

<body>

<div id="warningScreen">⚠️ UNLOCK FIRST! ⚠️</div>

<button class="animal-btn tiger" onclick="animalClick('tiger')">🐯</button>
<button class="animal-btn monkey" onclick="animalClick('monkey')">🐒</button>
<button class="animal-btn elephant" onclick="animalClick('elephant')">🐘</button>
<button class="animal-btn giraffe" onclick="animalClick('giraffe')">🦒</button>

<div class="center">
    <h1>💰 Shop Money: <span id="money">0</span></h1>

    <div class="money-controls">
        <button onclick="increase()" class="action">+</button>
        <button onclick="decrease()" class="action">-</button>
    </div>
</div>

<script>
(() => {

/* ================= FIREBASE ================= */
firebase.initializeApp({
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT"
});

const r = firebase.database().ref("shopMoney");
const m = document.getElementById("money");
const w = document.getElementById("warningScreen");

/* ================= FIX: ENSURE DATA EXISTS ================= */
r.on("value", snap => {
    let v = snap.val();

    if (v === null || v === undefined) {
        r.set(0);
        v = 0;
    }

    m.textContent = v;
});

/* ================= STATE ================= */
let unlocked = false;
let failed = false;
let playerOrder = [];
let finalGateActive = false;
let lockUntil = 0;

/* ================= PUZZLE ================= */
const correctOrder = ["tiger", "tiger", "elephant"];
const secretPasscode = "G";

const map = {
    tiger: "t",
    monkey: "m",
    elephant: "e",
    giraffe: "g"
};

/* ================= WARNING ================= */
function showWarning() {
    w.style.display = "flex";
    setTimeout(() => {
        w.style.display = "none";
    }, 1200);
}

/* ================= LOCK ================= */
function isLocked() {
    return Date.now() < lockUntil;
}

function lockScreen() {
    document.body.innerHTML =
    `<div style="
        position:fixed;
        inset:0;
        background:black;
        color:red;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:28px;">
        🔒 LOCKED FOR 30 MINUTES 🔒
    </div>`;
}

/* ================= MONEY ================= */
window.increase = function () {
    if (isLocked()) return lockScreen();
    if (!unlocked) return showWarning();
    r.transaction(v => (v || 0) + 1);
};

window.decrease = function () {
    if (isLocked()) return lockScreen();
    if (!unlocked) return showWarning();
    r.transaction(v => (v || 0) - 1);
};

/* ================= ANIMAL CLICK ================= */
window.animalClick = function (animal) {
    if (isLocked()) return lockScreen();
    if (failed || unlocked || finalGateActive) return;

    const expected = correctOrder[playerOrder.length];

    if (animal !== expected) {
        failed = true;
        return;
    }

    playerOrder.push(animal);

    if (playerOrder.length === correctOrder.length) {
        showUnlockButton();
    }
};

/* ================= HIDDEN BUTTON ================= */
const btn = document.createElement("button");
btn.style.cssText =
"position:fixed;width:60px;height:60px;opacity:0;display:none;z-index:99999";
document.body.appendChild(btn);

function showUnlockButton() {
    finalGateActive = true;

    btn.style.display = "block";
    btn.style.left = Math.random() * (innerWidth - 60) + "px";
    btn.style.top = Math.random() * (innerHeight - 60) + "px";
}

/* ================= UNLOCK ================= */
btn.onclick = function () {
    const input = prompt("Enter secret passcode:");

    if (input === secretPasscode) {
        unlocked = true;
        finalGateActive = false;
        btn.style.display = "none";

        setTimeout(() => {
            unlocked = false;
        }, 10000);

    } else {
        lockUntil = Date.now() + 30 * 60 * 1000;
        lockScreen();
    }
};

})();
</script>

</body>
</html>
