<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Money Game</title>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>

<style>
body {
    margin:0;
    font-family:Arial;
    overflow:hidden;
    color:white;
    background:linear-gradient(to bottom,#1db954,#0b6623);
}

.animal-btn {
    position:fixed;
    background:transparent;
    border:none;
    font-size:110px;
    cursor:pointer;
    z-index:9999;
}

.tiger{bottom:20px;right:20px}
.monkey{top:20px;left:20px;font-size:90px}
.elephant{bottom:20px;left:20px}
.giraffe{top:20px;right:20px;font-size:140px}

.center{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:15px;
}

button{
    padding:12px 20px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.action{background:#2ecc71;color:white}

#warning{
    position:fixed;
    inset:0;
    background:red;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:40px;
    font-weight:bold;
    z-index:99999;
}
</style>
</head>

<body>

<div id="warning">⚠️ WRONG SEQUENCE ⚠️</div>

<button class="animal-btn tiger" onclick="animalClick('tiger')">🐯</button>
<button class="animal-btn monkey" onclick="animalClick('monkey')">🐒</button>
<button class="animal-btn elephant" onclick="animalClick('elephant')">🐘</button>
<button class="animal-btn giraffe" onclick="animalClick('giraffe')">🦒</button>

<div class="center">
<h1>💰 Shop Money: <span id="money">0</span></h1>

<div>
<button onclick="increase()" class="action">+</button>
<button onclick="decrease()" class="action">-</button>
</div>
</div>

<script>
(() => {

const firebaseConfig = {
apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
databaseURL:"https://YOUR_PROJECT-default-rtdb.firebaseio.com",
projectId:"YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let unlocked = false;
let seq = [];
let failed = false;

const warning = document.getElementById("warning");

function warn(){
warning.style.display="flex";
setTimeout(()=>warning.style.display="none",1200);
}

/* IMPORTANT: no order stored here anymore */
const map = {
tiger:"t",
monkey:"m",
elephant:"e",
giraffe:"g"
};

auth.signInAnonymously().then(async user => {

const ref = db.ref("shopMoney/"+user.user.uid);

ref.once("value",s=>{
if(s.val()===null) ref.set(0);
});

ref.on("value",s=>{
document.getElementById("money").textContent = s.val()||0;
});

/* MONEY */
window.increase=()=>{
if(!unlocked) return warn();
ref.transaction(v=>(v||0)+1);
};

window.decrease=()=>{
if(!unlocked) return warn();
ref.transaction(v=>(v||0)-1);
};

/* ANIMALS */
window.animalClick = async (a)=>{

if(failed||unlocked) return;

seq.push(map[a]);

/* send sequence to server */
const res = await fetch("https://YOUR-WORKER-URL.workers.dev/check",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
sequence: seq
})
});

const data = await res.json();

if(data.fail){
failed=true;
warn();
setTimeout(()=>{failed=false;seq=[];},1000);
return;
}

/* unlocked by server */
if(data.unlocked){
unlocked=true;
alert("Unlocked!");
setTimeout(()=>unlocked=false,10000);
}

};

});

})();
</script>

</body>
</html>
