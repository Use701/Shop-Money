<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Money Game</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    overflow: hidden;
    color: white;
    background: linear-gradient(to bottom, #1db954, #0b6623);
}

/* ANIMALS */
.animal-btn {
    position: fixed;
    background: transparent;
    border: none;
    font-size: 90px;
    cursor: pointer;
}

#tiger { bottom: 50px; right: 120px; }
#elephant { bottom: 20px; left: 20px; font-size: 130px; }
#giraffe { top: 20px; right: 20px; font-size: 150px; }
#monkey { top: 80px; left: 80px; font-size: 90px; }

/* UI */
.center {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

.money-controls {
    display: flex;
    gap: 10px;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.action {
    background: #2ecc71;
    color: white;
}

/* hidden unlock button */
#unlockBtn {
    position: fixed;
    width: 80px;
    height: 40px;
    opacity: 0;
    display: none;
}
</style>
</head>

<body>

<!-- ANIMALS -->
<button class="animal-btn" onclick="animalClick('tiger')">🐯</button>
<button class="animal-btn" onclick="animalClick('monkey')">🐒</button>
<button class="animal-btn" onclick="animalClick('elephant')">🐘</button>
<button class="animal-btn" onclick="animalClick('giraffe')">🦒</button>

<div class="center">
    <h1>💰 Shop Money: <span id="money">0</span></h1>

    <div class="money-controls">
        <button onclick="increase()" class="action">+</button>
        <button onclick="decrease()" class="action">-</button>
    </div>
</div>

<button id="unlockBtn" onclick="unlockClick()"></button>

<script>
let unlocked = false;
let lockUntil = 0;

const correctOrder = ["tiger", "elephant", "giraffe"];
let playerOrder = [];

/* RED SCREEN */
function showRedScreen(msg) {
    document.body.innerHTML = `
        <div style="
            position:fixed;
            inset:0;
            background:red;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:40px;
            text-align:center;
        ">
        ⚠ ${msg}
        </div>
    `;
}

/* MONEY (simple local version so it ALWAYS works) */
let money = 0;

function updateMoney() {
    document.getElementById("money").textContent = money;
}

/* + - */
function increase() {
    if (!unlocked) return showRedScreen("Unlock first!");
    money++;
    updateMoney();
}

function decrease() {
    if (!unlocked) return showRedScreen("Unlock first!");
    money--;
    updateMoney();
}

/* ANIMALS */
function animalClick(animal) {

    if (animal === "monkey") {
        alert("🐒 distraction!");
        return;
    }

    playerOrder.push(animal);

    for (let i = 0; i < playerOrder.length; i++) {
        if (playerOrder[i] !== correctOrder[i]) {
            playerOrder = [];
            lockUntil = Date.now() + 30 * 60 * 1000;
            showRedScreen("Wrong order! Locked 30 minutes.");
            return;
        }
    }

    if (playerOrder.length === correctOrder.length) {
        const btn = document.getElementById("unlockBtn");
        btn.style.display = "block";

        btn.style.left = Math.random() * (window.innerWidth - 80) + "px";
        btn.style.top = Math.random() * (window.innerHeight - 40) + "px";

        alert("✅ Unlock button appeared!");
    }
}

/* UNLOCK */
function unlockClick() {

    if (Date.now() < lockUntil) {
        showRedScreen("Locked for 30 minutes!");
        return;
    }

    let code = prompt("Enter password:");

    if (code !== "🫆") {
        lockUntil = Date.now() + 30 * 60 * 1000;
        showRedScreen("Wrong password! Locked 30 minutes.");
        return;
    }

    unlocked = true;
    alert("Unlocked for 10 seconds!");

    setTimeout(() => unlocked = false, 10000);
}

/* init */
updateMoney();
</script>

</body>
</html>
