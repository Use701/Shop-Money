<script>
let money = parseInt(localStorage.getItem("money")) || 0;
document.getElementById("money").textContent = money;

let unlocked = false;
let unlockTimer = null;


const A = "😡";
const B = "😈";
const C = "😂";
const D = "😭";
const E = "😎";
const F = "🥶";
const G = "🤡";
const H = "👻";
const I = "💀";
const J = "😺";
const K = "🐸";
const L = "🦊";
const M = "🐵";
const N = "🧠";
const O = "🔥";
const P = "⚡";
const Q = "🌈";
const R = "🌀";
const S = "⭐";
const T = "🌙";
const U = "☠️";
const V = "🧊";
const W = "🍀";
const X = "🪐";
const Y = "🎯";
const Z = "👁️";


const secretCode = Q;


let wrongAttempts = parseInt(localStorage.getItem("wrongAttempts")) || 0;
let lockUntil = parseInt(localStorage.getItem("lockUntil")) || 0;

function isLocked() {
    return Date.now() < lockUntil;
}

function showRedScreen(msg) {
    document.body.innerHTML = `
        <div style="
            position:fixed;
            inset:0;
            background:red;
            color:white;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            font-family:Arial;
            font-size:40px;
            text-align:center;
        ">
            <h1>⚠ ACCESS DENIED ⚠</h1>
            <p>${msg}</p>
        </div>
    `;
}

function unlock() {
    if (isLocked()) {
        showRedScreen("Locked for 30 minutes!");
        return;
    }

    let code = prompt("Enter secret code:");

    if (code !== secretCode) {
        wrongAttempts++;
        localStorage.setItem("wrongAttempts", wrongAttempts);

        if (wrongAttempts >= 3) {
            lockUntil = Date.now() + 30 * 60 * 1000;
            localStorage.setItem("lockUntil", lockUntil);

            wrongAttempts = 0;
            localStorage.setItem("wrongAttempts", 0);

            showRedScreen("Too many wrong attempts! Locked for 30 minutes.");
        } else {
            alert("Wrong code! Attempts: " + wrongAttempts + "/3");
        }
        return;
    }

    wrongAttempts = 0;
    localStorage.setItem("wrongAttempts", 0);

    unlocked = true;
    alert("Unlocked for 10 seconds!");

    clearTimeout(unlockTimer);

    unlockTimer = setTimeout(() => {
        unlocked = false;
        alert("Lock expired");
    }, 10000);
}

function increase() {
    if (!unlocked) return showRedScreen("Click unlock first!");
    money++;
    save();
}

function decrease() {
    if (!unlocked) return showRedScreen("Click unlock first!");
    money--;
    save();
}

function save() {
    document.getElementById("money").textContent = money;
    localStorage.setItem("money", money);
}
</script>
