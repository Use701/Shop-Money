<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Money Jungle Game</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    overflow: hidden;
    color: white;
    background: linear-gradient(to bottom, #0b3d1e, #06240f);
}

/* jungle layers */
.layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

#layer1 { opacity: 0.25; z-index: 0; }
#layer2 { opacity: 0.4; z-index: 1; }
#layer3 { opacity: 0.6; z-index: 2; }

/* ===== ANIMAL BUTTONS ===== */
.animal-btn {
    position: fixed;
    background: transparent;
    border: none;
    font-size: 80px;
    cursor: pointer;
    z-index: 3;
    transition: transform 0.1s;
}

.animal-btn:active {
    transform: scale(0.9);
}

/* positions */
#giraffe { top: 10px; right: 10px; font-size: 150px; }
#monkey { top: 80px; left: 120px; font-size: 90px; }
#elephant { bottom: 10px; left: 20px; font-size: 140px; }
#tiger { bottom: 40px; right: 120px; font-size: 120px; }

/* banana decoration */
#banana {
    position: fixed;
    top: 130px;
    left: 170px;
    font-size: 35px;
    z-index: 3;
}

/* UI */
.center {
    position: relative;
    z-index: 5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

.money-controls {
    display: flex;
    gap: 10px;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.action {
    background: #2ecc71;
    color: white;
}

/* hidden unlock */
#unlockBtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 80px;
    height: 40px;
    opacity: 0;
    z-index: 10;
}
</style>
</head>

<body>

<!-- 🌴 jungle layers -->
<div id="layer1" class="layer"></div>
<div id="layer2" class="layer"></div>
<div id="layer3" class="layer"></div>

<!-- 🐾 ANIMAL BUTTONS -->
<button id="giraffe" class="animal-btn" onclick="animalClick('giraffe')">🦒</button>
<button id="monkey" class="animal-btn" onclick="animalClick('monkey')">🐒</button>
<button id="elephant" class="animal-btn" onclick="animalClick('elephant')">🐘</button>
<button id="tiger" class="animal-btn" onclick="animalClick('tiger')">🐯</button>

<div id="banana">🍌</div>

<!-- UI -->
<div class="center">

    <h1>💰 Shop Money: <span id="money">0</span></h1>

    <div class="money-controls">
        <button onclick="increase()" class="action">+</button>
        <button onclick="decrease()" class="action">-</button>
    </div>

</div>

<!-- hidden unlock -->
<button id="unlockBtn" onclick="unlockClick()"></button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getDatabase,
  ref,
  onValue,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const moneyRef = ref(db, "money");

/* STATE */
let unlocked = false;
let lockUntil = 0;
let wrongAttempts = 0;

/* MONEY */
onValue(moneyRef, (snap) => {
    document.getElementById("money").textContent = snap.val() || 0;
});

/* + - */
window.increase = function () {
    if (!unlocked) return showRedScreen("Unlock first!");
    runTransaction(moneyRef, v => (v || 0) + 1);
};

window.decrease = function () {
    if (!unlocked) return showRedScreen("Unlock first!");
    runTransaction(moneyRef, v => (v || 0) - 1);
};

/* ANIMAL CLICK FUNCTION */
window.animalClick = function (animal) {
    console.log("Clicked:", animal);
    alert("You clicked " + animal + " 🐾");
};

/* RED SCREEN */
function showRedScreen(msg) {
    document.body.innerHTML = `
        <div style="
            position:fixed;
            inset:0;
            background:red;
            color:white;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            font-size:40px;
            font-family:Arial;
            text-align:center;
        ">
        <h1>⚠ ACCESS DENIED ⚠</h1>
        <p>${msg}</p>
        </div>
    `;
}

/* LOCK */
function isLocked() {
    return Date.now() < lockUntil;
}

/* UNLOCK */
window.unlockClick = function () {

    if (isLocked()) {
        showRedScreen("Locked 30 minutes!");
        return;
    }

    let code = prompt("Enter password:");

    if (code !== "🫆") {
        wrongAttempts++;

        if (wrongAttempts >= 1) {
            lockUntil = Date.now() + 30 * 60 * 1000;
            wrongAttempts = 0;
            showRedScreen("Wrong password! Locked 30 minutes.");
        }
        return;
    }

    unlocked = true;
    alert("Unlocked for 10 seconds!");

    setTimeout(() => unlocked = false, 10000);
};
</script>

</body>
</html>
