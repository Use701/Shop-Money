<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Money Game</title>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    overflow: hidden;
    color: white;
    background: linear-gradient(to bottom, #1db954, #0b6623);
}

.animal-btn {
    position: fixed;
    background: transparent;
    border: none;
    font-size: 110px;
    cursor: pointer;
    z-index: 9999;
    user-select: none;
}

.elephant { bottom: 20px; left: 20px; }
.monkey { top: 20px; left: 20px; font-size: 90px; }
.giraffe { top: 20px; right: 20px; font-size: 140px; }
.tiger { bottom: 20px; right: 20px; }

.center {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

.money-controls {
    display: flex;
    gap: 10px;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.action {
    background: #2ecc71;
    color: white;
}

#warningScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: red;
    color: white;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: bold;
    z-index: 99999;
}
</style>
</head>

<body>

<div id="warningScreen">⚠️ UNLOCK FIRST! ⚠️</div>

<button class="animal-btn tiger" onclick="animalClick('tiger')">🐯</button>
<button class="animal-btn monkey" onclick="animalClick('monkey')">🐒</button>
<button class="animal-btn elephant" onclick="animalClick('elephant')">🐘</button>
<button class="animal-btn giraffe" onclick="animalClick('giraffe')">🦒</button>

<div class="center">
    <h1>💰 Shop Money: <span id="money">0</span></h1>

    <div class="money-controls">
        <button onclick="increase()" class="action">+</button>
        <button onclick="decrease()" class="action">-</button>
    </div>
</div>

<script>
(() => {

function startGame(){

if (!window.firebase) {
console.error("Firebase not loaded");
return;
}

firebase.initializeApp({
apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
databaseURL:"https://YOUR_PROJECT-default-rtdb.firebaseio.com",
projectId:"YOUR_PROJECT"
});

const auth = firebase.auth();
const db = firebase.database();

const moneyEl = document.getElementById("money");
const warnEl = document.getElementById("warningScreen");

if (!moneyEl || !warnEl) return;

let unlocked = 0;
let failed = 0;
let seq = [];
let gate = 0;
let lockUntil = 0;

const order = ["tiger","tiger","tiger","tiger","tiger","tiger","tiger","tiger","tiger","tiger","tiger","tiger","tiger","tiger","tiger","tiger","tiger","tiger","tiger","tiger","elephant"];
const map = {tiger:"t",monkey:"m",elephant:"e",giraffe:"g"};
const PASS = "MONKEY";

moneyEl.textContent = "0";

auth.signInAnonymously().then(user => {

const ref = db.ref("shopMoney/" + user.user.uid);

ref.once("value", snap => {
if (snap.val() === null) ref.set(0);
});

ref.on("value", snap => {
moneyEl.textContent = snap.val() || 0;
});

const warn = () => {
warnEl.style.display = "flex";
setTimeout(() => warnEl.style.display = "none", 1200);
};

const locked = () => Date.now() < lockUntil;

const lockScreen = () => {
document.body.innerHTML =
`<div style="position:fixed;inset:0;background:black;color:red;display:flex;align-items:center;justify-content:center;font-size:28px">
LOCKED FOR 30 MINUTES
</div>`;
};

window.increase = () => {
if (locked()) return lockScreen();
if (!unlocked) return warn();
ref.transaction(v => (v || 0) + 1);
};

window.decrease = () => {
if (locked()) return lockScreen();
if (!unlocked) return warn();
ref.transaction(v => (v || 0) - 1);
};

window.animalClick = (a) => {
if (locked()) return lockScreen();
if (failed || unlocked || gate) return;

if (map[a] !== order[seq.length]) return failed = 1;

seq.push(map[a]);

if (seq.length === order.length) {
gate = 1;

const btn = document.createElement("button");
btn.style.cssText =
"position:fixed;width:60px;height:60px;opacity:0;display:none;z-index:99999";

document.body.appendChild(btn);

btn.style.display = "block";
btn.style.left = Math.random() * (innerWidth - 60) + "px";
btn.style.top = Math.random() * (innerHeight - 60) + "px";

btn.onclick = () => {
const input = prompt("Enter code:");

if (input === PASS) {
unlocked = 1;
gate = 0;
btn.style.display = "none";

setTimeout(() => unlocked = 0, 10000);

} else {
lockUntil = Date.now() + 1800000;
lockScreen();
}
};

}

});

}

if (document.readyState === "loading") {
document.addEventListener("DOMContentLoaded", startGame);
} else {
startGame();
}

})();
</script>

</body>
</html>
