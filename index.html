<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Money Jungle Game</title>

<style>
/* ===== BACKGROUND ===== */
body {
    margin: 0;
    font-family: Arial;
    overflow: hidden;
    color: white;
    background: linear-gradient(to bottom, #0b3d1e, #06240f);
}

/* jungle depth layers */
.layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

#layer1 {
    background: url("https://i.imgur.com/7Y3bK7m.png") repeat-x bottom;
    opacity: 0.25;
    z-index: 0;
}

#layer2 {
    background: url("https://i.imgur.com/8QZ7xXh.png") repeat-x bottom;
    opacity: 0.4;
    z-index: 1;
}

#layer3 {
    background: url("https://i.imgur.com/2Z8qz0L.png") repeat-x bottom;
    opacity: 0.6;
    z-index: 2;
}

/* ===== ANIMALS ===== */
.animal {
    position: fixed;
    z-index: 3;
    pointer-events: none;
}

#giraffe {
    font-size: 160px;
    top: 10px;
    right: 10px;
}

#monkey {
    font-size: 80px;
    top: 60px;
    left: 120px;
}

#banana {
    position: fixed;
    top: 110px;
    left: 160px;
    font-size: 35px;
    z-index: 3;
}

#elephant {
    font-size: 140px;
    bottom: 10px;
    left: 20px;
}

#tiger {
    font-size: 120px;
    bottom: 40px;
    right: 120px;
    opacity: 0.9;
}

/* ===== UI ===== */
.center {
    position: relative;
    z-index: 5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.money-controls {
    display: flex;
    gap: 10px;
}

.action {
    background: #2ecc71;
    color: white;
}

/* invisible unlock button */
#unlockBtn {
    position: fixed;
    width: 80px;
    height: 40px;
    opacity: 0;
    z-index: 10;
}
</style>
</head>

<body>

<!-- 🌴 jungle layers -->
<div id="layer1" class="layer"></div>
<div id="layer2" class="layer"></div>
<div id="layer3" class="layer"></div>

<!-- 🐾 animals -->
<div id="giraffe" class="animal">🦒</div>
<div id="monkey" class="animal">🐒</div>
<div id="banana" class="animal">🍌</div>
<div id="elephant" class="animal">🐘</div>
<div id="tiger" class="animal">🐯</div>

<!-- UI -->
<div class="center">

    <h1>💰 Shop Money: <span id="money">0</span></h1>

    <div class="money-controls">
        <button onclick="increase()" class="action">+</button>
        <button onclick="decrease()" class="action">-</button>
    </div>

</div>

<!-- invisible unlock button -->
<button id="unlockBtn" onclick="unlockClick()"></button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getDatabase,
  ref,
  onValue,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

/* ===== FIREBASE (REPLACE THIS) ===== */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const moneyRef = ref(db, "money");

/* ===== GAME STATE ===== */
let unlocked = false;
let lockUntil = 0;
let wrongAttempts = 0;

/* ===== LIVE MONEY ===== */
onValue(moneyRef, (snapshot) => {
    document.getElementById("money").textContent = snapshot.val() || 0;
});

/* ===== MONEY ACTIONS ===== */
window.increase = function () {
    if (!unlocked) return alert("Unlock first!");
    runTransaction(moneyRef, v => (v || 0) + 1);
};

window.decrease = function () {
    if (!unlocked) return alert("Unlock first!");
    runTransaction(moneyRef, v => (v || 0) - 1);
};

/* ===== MOVE HIDDEN BUTTON ===== */
function moveButton() {
    const btn = document.getElementById("unlockBtn");

    const x = Math.random() * (window.innerWidth - 80);
    const y = Math.random() * (window.innerHeight - 40);

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

/* ===== LOCK CHECK ===== */
function isLocked() {
    return Date.now() < lockUntil;
}

/* ===== INIT ===== */
window.onload = function () {
    moveButton();

    setInterval(() => {
        if (!unlocked) moveButton();
    }, 1200);
};

/* ===== UNLOCK SYSTEM ===== */
window.unlockClick = function () {

    if (isLocked()) {
        alert("⛔ Locked for 30 minutes!");
        return;
    }

    let code = prompt("Enter password:");

    if (code !== "🫆") {
        wrongAttempts++;

        if (wrongAttempts >= 1) {
            lockUntil = Date.now() + 30 * 60 * 1000;
            wrongAttempts = 0;
            alert("⛔ Wrong password! Locked 30 minutes.");
        }
        return;
    }

    unlocked = true;
    alert("🔓 Unlocked for 10 seconds!");

    setTimeout(() => {
        unlocked = false;
    }, 10000);
};
</script>

</body>
</html>
