<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Money Game - Secure</title>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    overflow: hidden;
    color: white;
    background: linear-gradient(to bottom, #1db954, #0b6623);
}

.animal-btn {
    position: fixed;
    background: transparent;
    border: none;
    font-size: 110px;
    cursor: pointer;
    z-index: 9999;
    user-select: none;
}

.elephant { bottom: 20px; left: 20px; }
.monkey { top: 20px; left: 20px; font-size: 90px; }
.giraffe { top: 20px; right: 20px; font-size: 140px; }
.tiger { bottom: 20px; right: 20px; }

.center {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

.money-controls {
    display: flex;
    gap: 10px;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.action {
    background: #2ecc71;
    color: white;
}

#warningScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: red;
    color: white;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: bold;
    z-index: 99999;
}
</style>
</head>

<body>

<div id="warningScreen">⚠️ UNLOCK FIRST! ⚠️</div>

<button class="animal-btn tiger" onclick="animalClick('tiger')">🐯</button>
<button class="animal-btn monkey" onclick="animalClick('monkey')">🐒</button>
<button class="animal-btn elephant" onclick="animalClick('elephant')">🐘</button>
<button class="animal-btn giraffe" onclick="animalClick('giraffe')">🦒</button>

<div class="center">
    <h1>💰 Shop Money: <span id="money">0</span></h1>

    <div class="money-controls">
        <button onclick="increase()" class="action">+</button>
        <button onclick="decrease()" class="action">-</button>
    </div>
</div>

<script>
(()=>{

/* ================= FIREBASE ================= */
firebase.initializeApp({
apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
databaseURL:"https://YOUR_PROJECT-default-rtdb.firebaseio.com",
projectId:"YOUR_PROJECT"
});

const auth=firebase.auth();
const db=firebase.database();

let uid=null;
let unlocked=0,failed=0,seq=[],gate=0,lock=0;

const order=["tiger","tiger","elephant"];
const map={tiger:"t",monkey:"m",elephant:"e",giraffe:"g"};

/* ================= UI ================= */
const m=document.getElementById("money");
const w=document.getElementById("warningScreen");

/* ================= AUTH ================= */
auth.signInAnonymously().then(u=>{
uid=u.user.uid;
init();
});

/* ================= CORE ================= */
function init(){

const ref=db.ref("shopMoney/"+uid);

/* create account if missing */
ref.once("value",s=>{
if(s.val()===null) ref.set(0);
});

/* live money sync */
ref.on("value",s=>{
m.textContent=s.val()||0;
});

/* warning */
const warn=()=>{
w.style.display="flex";
setTimeout(()=>w.style.display="none",1200);
};

/* lock screen */
const locked=()=>Date.now()<lock;

const lockScreen=()=>{
document.body.innerHTML=
`<div style="position:fixed;inset:0;background:#000;color:red;display:flex;align-items:center;justify-content:center;font-size:28px">
LOCKED FOR 30 MINUTES</div>`;
};

/* ================= SAFE MONEY ================= */
window.increase=()=>{
if(locked())return lockScreen();
if(!unlocked)return warn();

ref.transaction(v=>(v||0)+1);
};

window.decrease=()=>{
if(locked())return lockScreen();
if(!unlocked)return warn();

ref.transaction(v=>(v||0)-1);
};

/* ================= ANIMAL GAME ================= */
window.animalClick=a=>{
if(locked())return lockScreen();
if(failed||unlocked||gate)return;

if(map[a]!==order[seq.length]) return failed=1;

seq.push(map[a]);
if(seq.length===order.length) spawn();
};

/* ================= INVISIBLE UNLOCK ================= */
const btn=document.createElement("button");
btn.style.cssText="position:fixed;width:60px;height:60px;opacity:0;display:none;z-index:99999";
document.body.appendChild(btn);

function spawn(){
gate=1;
btn.style.display="block";
btn.style.left=Math.random()*(innerWidth-60)+"px";
btn.style.top=Math.random()*(innerHeight-60)+"px";
}

btn.onclick=()=>{
let p=prompt("Enter code:");

if(p==="G"){
unlocked=1;
gate=0;
btn.style.display="none";

setTimeout(()=>unlocked=0,10000);

}else{
lock=Date.now()+1800000;
lockScreen();
}
};

}

})();
</script>

</body>
</html>
