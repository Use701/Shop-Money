<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Money Jungle</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    overflow: hidden;
    color: white;

    background: url("https://images.unsplash.com/photo-1502082553048-f009c37129b9") no-repeat center center fixed;
    background-size: cover;
}

/* dark overlay */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
}

/* ========== ANIMALS ========== */
.animal {
    position: fixed;
    z-index: 1;
    pointer-events: none;
}

/* 🦒 giraffe eating tree */
#giraffe {
    font-size: 140px;
    top: 10px;
    right: 20px;
    transform: rotate(-5deg);
}

/* 🌳 monkey in tree */
#monkey {
    font-size: 70px;
    top: 40px;
    left: 80px;
}

/* 🍌 banana near monkey */
#banana {
    position: fixed;
    font-size: 30px;
    top: 90px;
    left: 120px;
    z-index: 1;
}

/* 🐘 elephant on ground */
#elephant {
    font-size: 120px;
    bottom: 10px;
    left: 20px;
}

/* 🐯 tiger behind tree */
#tiger {
    font-size: 110px;
    bottom: 20px;
    right: 80px;
    opacity: 0.85;
}

/* center UI */
.center {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

/* buttons */
button {
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.action {
    background: #2ecc71;
    color: white;
}

/* ➕ ➖ side by side */
.money-controls {
    display: flex;
    gap: 10px;
}

/* invisible unlock button */
#unlockBtn {
    position: fixed;
    width: 80px;
    height: 40px;
    opacity: 0;
    z-index: 5;
}
</style>
</head>

<body>

<!-- 🌴 NATURAL ANIMALS -->
<div id="giraffe" class="animal">🦒</div>
<div id="monkey" class="animal">🐒</div>
<div id="banana" class="animal">🍌</div>
<div id="elephant" class="animal">🐘</div>
<div id="tiger" class="animal">🐯</div>

<div class="center">

    <h1>💰 Shop Money: <span id="money">0</span></h1>

    <div class="money-controls">
        <button onclick="increase()" class="action">+</button>
        <button onclick="decrease()" class="action">-</button>
    </div>

</div>

<!-- invisible unlock button -->
<button id="unlockBtn" onclick="unlockClick()"></button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getDatabase,
  ref,
  onValue,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const moneyRef = ref(db, "money");

/* STATE */
let unlocked = false;
let lockUntil = 0;
let wrongAttempts = 0;

/* LIVE MONEY */
onValue(moneyRef, (snapshot) => {
    document.getElementById("money").textContent = snapshot.val() || 0;
});

/* ➕ ➖ */
window.increase = function () {
    if (!unlocked) return alert("Unlock first!");
    runTransaction(moneyRef, v => (v || 0) + 1);
};

window.decrease = function () {
    if (!unlocked) return alert("Unlock first!");
    runTransaction(moneyRef, v => (v || 0) - 1);
};

/* MOVE HIDDEN BUTTON */
function moveButton() {
    const btn = document.getElementById("unlockBtn");

    const x = Math.random() * (window.innerWidth - 80);
    const y = Math.random() * (window.innerHeight - 40);

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

/* LOCK CHECK */
function isLocked() {
    return Date.now() < lockUntil;
}

/* INIT */
window.onload = function () {
    moveButton();
    setInterval(() => {
        if (!unlocked) moveButton();
    }, 1200);
};

/* UNLOCK SYSTEM */
window.unlockClick = function () {

    if (isLocked()) {
        alert("⛔ Locked for 30 minutes!");
        return;
    }

    let code = prompt("Enter password:");

    if (code !== "🫆") {
        wrongAttempts++;

        if (wrongAttempts >= 1) {
            lockUntil = Date.now() + 30 * 60 * 1000;
            wrongAttempts = 0;
            alert("⛔ Wrong password! Locked 30 minutes.");
        }
        return;
    }

    unlocked = true;
    alert("🔓 Unlocked for 10 seconds!");

    setTimeout(() => {
        unlocked = false;
    }, 10000);
};
</script>

</body>
</html>
