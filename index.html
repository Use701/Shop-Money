<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Money Game</title>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    overflow: hidden;
    color: white;
    background: linear-gradient(to bottom, #1db954, #0b6623);
}

.animal-btn {
    position: fixed;
    background: transparent;
    border: none;
    font-size: 110px;
    cursor: pointer;
    z-index: 9999;
    user-select: none;
}

.elephant { bottom: 20px; left: 20px; }
.monkey { top: 20px; left: 20px; font-size: 90px; }
.giraffe { top: 20px; right: 20px; font-size: 140px; }
.tiger { bottom: 20px; right: 20px; }

.center {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

.money-controls {
    display: flex;
    gap: 10px;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.action {
    background: #2ecc71;
    color: white;
}

#warningScreen {
    position: fixed;
    inset: 0;
    background: red;
    color: white;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: bold;
    z-index: 99999;
}
</style>
</head>

<body>

<div id="warningScreen">⚠️ UNLOCK FIRST! ⚠️</div>

<button class="animal-btn tiger" onclick="animalClick('tiger')">🐯</button>
<button class="animal-btn monkey" onclick="animalClick('monkey')">🐒</button>
<button class="animal-btn elephant" onclick="animalClick('elephant')">🐘</button>
<button class="animal-btn giraffe" onclick="animalClick('giraffe')">🦒</button>

<div class="center">
    <h1>💰 Shop Money: <span id="money">0</span></h1>

    <div class="money-controls">
        <button onclick="increase()" class="action">+</button>
        <button onclick="decrease()" class="action">-</button>
    </div>
</div>

<script>
(() => {

/* =========================
   WAIT FOR FIREBASE (FIXED)
========================= */
function waitForFirebaseReady(){
    return new Promise((resolve, reject) => {

        let tries = 0;

        const check = setInterval(() => {

            if (window.firebase &&
                firebase.auth &&
                firebase.database) {
                clearInterval(check);
                resolve();
            }

            tries++;
            if (tries > 40) {
                clearInterval(check);
                reject("Firebase failed to load");
            }

        }, 150);

    });
}

/* =========================
        MAIN GAME
========================= */
function startGame(){

firebase.initializeApp({
apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
databaseURL:"https://YOUR_PROJECT-default-rtdb.firebaseio.com",
projectId:"YOUR_PROJECT"
});

const auth = firebase.auth();
const db = firebase.database();

const moneyEl = document.getElementById("money");
const warnEl = document.getElementById("warningScreen");

let unlocked = false;
let failed = false;
let seq = [];
let gate = false;
let lockUntil = 0;

/* SIMPLE BUT WORKING ORDER */
const order = ["tiger","tiger","elephant"];
const map = {tiger:"t",monkey:"m",elephant:"e",giraffe:"g"};

moneyEl.textContent = "0";

auth.signInAnonymously().then(user => {

const ref = db.ref("shopMoney/" + user.user.uid);

ref.once("value", snap => {
if (snap.val() === null) ref.set(0);
});

ref.on("value", snap => {
moneyEl.textContent = snap.val() || 0;
});

const warn = () => {
warnEl.style.display = "flex";
setTimeout(() => warnEl.style.display = "none", 1200);
};

const locked = () => Date.now() < lockUntil;

const lockScreen = () => {
document.body.innerHTML =
`<div style="position:fixed;inset:0;background:black;color:red;display:flex;align-items:center;justify-content:center;font-size:28px">
LOCKED FOR 30 MINUTES
</div>`;
};

window.increase = () => {
if (locked()) return lockScreen();
if (!unlocked) return warn();
ref.transaction(v => (v || 0) + 1);
};

window.decrease = () => {
if (locked()) return lockScreen();
if (!unlocked) return warn();
ref.transaction(v => (v || 0) - 1);
};

window.animalClick = (a) => {

if (locked()) return lockScreen();
if (failed) return warn();
if (gate || unlocked) return;

if (map[a] !== order[seq.length]) {
failed = true;
warn();

setTimeout(() => {
failed = false;
seq = [];
}, 1200);

return;
}

seq.push(map[a]);

if (seq.length === order.length) {
gate = true;

const btn = document.createElement("button");
btn.style.position = "fixed";
btn.style.width = "60px";
btn.style.height = "60px";
btn.style.opacity = "0";
btn.style.zIndex = "99999";

btn.style.left = Math.random() * (innerWidth - 60) + "px";
btn.style.top = Math.random() * (innerHeight - 60) + "px";

document.body.appendChild(btn);

btn.onclick = async () => {
const input = prompt("Enter code:");

const res = await fetch("https://YOUR-WORKER-URL.workers.dev/verify", {
method:"POST",
headers:{"Content-Type":"application/json"},
body: JSON.stringify({ password: input })
});

const data = await res.json();

if (data.ok) {
unlocked = true;
gate = false;
btn.remove();

setTimeout(() => unlocked = false, 10000);
alert("Unlocked!");
} else {
lockUntil = Date.now() + 1800000;
lockScreen();
}
};

}

};

});

}

/* =========================
   SAFE START (IMPORTANT FIX)
========================= */
waitForFirebaseReady()
.then(startGame)
.catch(err => {
alert("ERROR: " + err);
});

})();
</script>

</body>
</html>
