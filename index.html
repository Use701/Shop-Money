<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cartoon Jungle Unlock Game</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    overflow: hidden;
    color: white;

    /* 🌴 cartoon jungle background */
    background: url("https://images.unsplash.com/photo-1502082553048-f009c37129b9") no-repeat center center fixed;
    background-size: cover;
}

/* dark overlay */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 0;
}

/* jungle decorations (animals sticking out) */
.animal {
    position: fixed;
    font-size: 60px;
    z-index: 1;
    pointer-events: none;
}

#monkey { top: 20px; left: 10px; }
#tiger { bottom: 20px; left: 10px; }
#elephant { bottom: 20px; right: 10px; }
#giraffe { top: 20px; right: 10px; }

/* center UI */
.center {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.action {
    background: #2ecc71;
    color: white;
}

/* invisible unlock button */
#unlockBtn {
    position: fixed;
    width: 80px;
    height: 40px;
    opacity: 0;
    z-index: 5;
}
</style>
</head>

<body>

<!-- 🐒 jungle decorations -->
<div id="monkey" class="animal">🐒</div>
<div id="tiger" class="animal">🐯</div>
<div id="elephant" class="animal">🐘</div>
<div id="giraffe" class="animal">🦒</div>

<div class="center">

    <h1>💰 Money: <span id="money">0</span></h1>

    <button onclick="increase()" class="action">+</button>
    <button onclick="decrease()" class="action">-</button>

    <h2>🔍 Find the hidden unlock button!</h2>

</div>

<!-- invisible unlock button -->
<button id="unlockBtn" onclick="unlockClick()"></button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getDatabase,
  ref,
  onValue,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const moneyRef = ref(db, "money");

/* GAME STATE */
let unlocked = false;
let lockUntil = 0;
let wrongAttempts = 0;

/* 💰 LIVE MONEY */
onValue(moneyRef, (snapshot) => {
    document.getElementById("money").textContent = snapshot.val() || 0;
});

/* ➕ ➖ */
window.increase = function () {
    if (!unlocked) return alert("Unlock first!");
    runTransaction(moneyRef, v => (v || 0) + 1);
};

window.decrease = function () {
    if (!unlocked) return alert("Unlock first!");
    runTransaction(moneyRef, v => (v || 0) - 1);
};

/* 🔒 lock check */
function isLocked() {
    return Date.now() < lockUntil;
}

/* 🔀 move invisible button */
function moveButton() {
    const btn = document.getElementById("unlockBtn");

    const x = Math.random() * (window.innerWidth - 80);
    const y = Math.random() * (window.innerHeight - 40);

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

/* init */
window.onload = function () {
    moveButton();

    setInterval(() => {
        if (!unlocked) moveButton();
    }, 1500);
};

/* 👆 click invisible button */
window.unlockClick = function () {

    if (isLocked()) {
        alert("⛔ Locked for 30 minutes!");
        return;
    }

    let code = prompt("Enter jungle password:");

    if (code !== "🫆") {
        wrongAttempts++;

        if (wrongAttempts >= 1) {
            lockUntil = Date.now() + 30 * 60 * 1000;
            wrongAttempts = 0;
            alert("⛔ Wrong! Locked for 30 minutes.");
        }
        return;
    }

    unlocked = true;
    alert("🔓 Unlocked for 10 seconds!");

    setTimeout(() => {
        unlocked = false;
    }, 10000);
};
</script>

</body>
</html>
