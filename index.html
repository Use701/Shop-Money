<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Money (Global)</title>

<style>
#unlockBtn {
    position: fixed;
    opacity: 0;
    width: 100px;
    height: 40px;
}
</style>
</head>

<body>

<h1>Money: <span id="money">0</span></h1>

<button id="unlockBtn" onclick="unlock()">🔓Unlock</button>
<button onclick="increase()">+</button>
<button onclick="decrease()">-</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getDatabase,
  ref,
  onValue,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

/* 🔥 FIREBASE CONFIG (CHANGE THIS) */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const moneyRef = ref(db, "money");

/* GAME STATE */
let unlocked = false;
let wrongAttempts = 0;
let lockUntil = 0;

/* SECRET CODE */
const secretCode = "🫆";

/* LIVE GLOBAL MONEY (everyone synced) */
onValue(moneyRef, (snapshot) => {
    const val = snapshot.val() || 0;
    document.getElementById("money").textContent = val;
});

/* RANDOM BUTTON POSITION */
function randomizeUnlockButton() {
    const btn = document.getElementById("unlockBtn");

    const maxX = window.innerWidth - 100;
    const maxY = window.innerHeight - 40;

    btn.style.left = Math.random() * maxX + "px";
    btn.style.top = Math.random() * maxY + "px";
}

/* RED SCREEN */
function showRedScreen(msg) {
    document.body.innerHTML = `
        <div style="
            position:fixed;
            inset:0;
            background:red;
            color:white;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            font-family:Arial;
            font-size:40px;
            text-align:center;
        ">
            <h1>⚠ ACCESS DENIED ⚠</h1>
            <p>${msg}</p>
        </div>
    `;
}

/* LOCK CHECK */
function isLocked() {
    return Date.now() < lockUntil;
}

/* UNLOCK SYSTEM */
window.unlock = function () {
    if (isLocked()) {
        showRedScreen("Locked for 30 minutes!");
        return;
    }

    let code = prompt("Enter secret code:");

    if (code !== secretCode) {
        wrongAttempts++;

        if (wrongAttempts >= 1) {
            lockUntil = Date.now() + 30 * 60 * 1000;
            wrongAttempts = 0;
            showRedScreen("Wrong code! Locked for 30 minutes.");
        }
        return;
    }

    wrongAttempts = 0;
    unlocked = true;

    alert("Unlocked for 10 seconds!");

    setTimeout(() => {
        unlocked = false;
        alert("Lock expired");
    }, 10000);
};

/* ➕ / ➖ SAFE GLOBAL UPDATE */
window.increase = function () {
    if (!unlocked) return showRedScreen("Click unlock first!");

    runTransaction(moneyRef, (current) => {
        return (current || 0) + 1;
    });
};

window.decrease = function () {
    if (!unlocked) return showRedScreen("Click unlock first!");

    runTransaction(moneyRef, (current) => {
        return (current || 0) - 1;
    });
};

/* INIT */
window.onload = function () {
    randomizeUnlockButton();
};
</script>

</body>
</html>
