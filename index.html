<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jungle Money Game</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    color: white;
    text-align: center;

    /* 🌴 Jungle background */
    background: url("https://images.unsplash.com/photo-1502082553048-f009c37129b9") no-repeat center center fixed;
    background-size: cover;
}

/* dark overlay */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 0;
}

h1, div, button {
    position: relative;
    z-index: 1;
}

.center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 15px;
}

/* buttons */
button {
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.action-btn {
    background: #2ecc71;
    color: white;
}

.game-btn {
    background: #3498db;
    color: white;
}

/* invisible final button */
#finalBtn {
    opacity: 0;
    position: absolute;
}
</style>
</head>

<body>

<div class="center">

    <h1>💰 Money: <span id="money">0</span></h1>

    <!-- 🔓 unlock -->
    <button onclick="unlock()" class="action-btn">🔓 Unlock</button>

    <!-- ➕ ➖ -->
    <div>
        <button onclick="increase()" class="action-btn">+</button>
        <button onclick="decrease()" class="action-btn">-</button>
    </div>

    <hr style="width:200px; opacity:0.5">

    <!-- 🎮 jungle game -->
    <h2>🐾 Jungle Challenge</h2>

    <button onclick="clickAnimal('giraffe')" class="game-btn">🦒 Giraffe</button>
    <button onclick="clickAnimal('tiger')" class="game-btn">🐯 Tiger</button>
    <button onclick="clickAnimal('elephant')" class="game-btn">🐘 Elephant</button>

    <button id="finalBtn" onclick="finalClick()">👆</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getDatabase,
  ref,
  onValue,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const moneyRef = ref(db, "money");

/* 💰 MONEY */
let unlocked = false;

/* 🎮 GAME STATE */
let step = 0;
let timer = null;
let gameActive = false;

/* LIVE MONEY */
onValue(moneyRef, (snapshot) => {
    document.getElementById("money").textContent = snapshot.val() || 0;
});

/* 💰 update money */
window.increase = function () {
    if (!unlocked) return alert("Unlock first!");
    runTransaction(moneyRef, v => (v || 0) + 1);
};

window.decrease = function () {
    if (!unlocked) return alert("Unlock first!");
    runTransaction(moneyRef, v => (v || 0) - 1);
};

/* 🔓 UNLOCK (kept simple) */
window.unlock = function () {
    unlocked = true;
    alert("Unlocked!");
};

/* 🎮 START TIMER */
function startGame() {
    gameActive = true;
    step = 0;

    clearTimeout(timer);
    timer = setTimeout(resetGame, 5000); // 5 sec limit
}

/* 🎮 RESET GAME */
function resetGame() {
    gameActive = false;
    step = 0;
    document.getElementById("finalBtn").style.opacity = 0;
}

/* 🎮 ANIMAL ORDER */
window.clickAnimal = function (animal) {

    if (!gameActive) startGame();

    const order = ["giraffe", "tiger", "elephant"];

    if (animal !== order[step]) {
        resetGame();
        return;
    }

    step++;

    if (step === 3) {
        // show invisible button
        const btn = document.getElementById("finalBtn");

        btn.style.opacity = 0.01;
        btn.style.left = (window.innerWidth/2 - 20) + "px";
        btn.style.top = (window.innerHeight/2 + 120) + "px";
    }
};

/* 🎯 FINAL CLICK */
window.finalClick = function () {
    if (!gameActive || step !== 3) return;

    alert("🎉 Success! You completed the jungle challenge!");
    resetGame();
};
</script>

</body>
</html>
