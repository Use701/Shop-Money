<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Money Game</title>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    overflow: hidden;
    color: white;
    background: linear-gradient(to bottom, #1db954, #0b6623);
}

.animal-btn {
    position: fixed;
    background: transparent;
    border: none;
    font-size: 110px;
    cursor: pointer;
    z-index: 9999;
    user-select: none;
}

.elephant { bottom: 20px; left: 20px; }
.monkey { top: 20px; left: 20px; font-size: 90px; }
.giraffe { top: 20px; right: 20px; font-size: 140px; }
.tiger { bottom: 20px; right: 20px; }

.center {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

.money-controls {
    display: flex;
    gap: 10px;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.action {
    background: #2ecc71;
    color: white;
}

#warningScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: red;
    color: white;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: bold;
    z-index: 99999;
}
</style>
</head>

<body>

<div id="warningScreen">⚠️ UNLOCK FIRST! ⚠️</div>

<button class="animal-btn tiger" onclick="animalClick('tiger')">🐯</button>
<button class="animal-btn monkey" onclick="animalClick('monkey')">🐒</button>
<button class="animal-btn elephant" onclick="animalClick('elephant')">🐘</button>
<button class="animal-btn giraffe" onclick="animalClick('giraffe')">🦒</button>

<div class="center">
    <h1>💰 Shop Money: <span id="money">0</span></h1>

    <div class="money-controls">
        <button onclick="increase()" class="action">+</button>
        <button onclick="decrease()" class="action">-</button>
    </div>
</div>

<script>
(() => {

firebase.initializeApp({
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT",
});

const r = firebase.database().ref("shopMoney");
const m = document.getElementById("money");
const w = document.getElementById("warningScreen");

let u = false,
    f = false,
    p = [],
    g = false,
    l = 0;

const o = ["t","t","e"];
const key = "G";

r.on("value", s => {
    m.textContent = s.val() || 0;
});

const warn = () => {
    w.style.display = "flex";
    setTimeout(() => w.style.display = "none", 1200);
};

const locked = () => Date.now() < l;

const block = () => {
    document.body.innerHTML =
    `<div style="
        position:fixed;
        inset:0;
        background:black;
        color:red;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:28px;">
        🔒 LOCKED FOR 30 MINUTES 🔒
    </div>`;
};

window.increase = () => {
    if (locked()) return block();
    if (!u) return warn();
    r.transaction(v => (v || 0) + 1);
};

window.decrease = () => {
    if (locked()) return block();
    if (!u) return warn();
    r.transaction(v => (v || 0) - 1);
};

const map = {
    tiger:"t",
    monkey:"m",
    elephant:"e",
    giraffe:"g"
};

window.animalClick = a => {
    if (locked()) return block();
    if (f || u || g) return;

    if (map[a] !== o[p.length]) {
        f = true;
        return;
    }

    p.push(map[a]);

    if (p.length === o.length) showBtn();
};

const b = document.createElement("button");
b.style.cssText =
"position:fixed;width:60px;height:60px;opacity:0;display:none;z-index:99999";
document.body.appendChild(b);

function showBtn() {
    g = true;
    b.style.display = "block";
    b.style.left = Math.random() * (innerWidth - 60) + "px";
    b.style.top = Math.random() * (innerHeight - 60) + "px";
}

b.onclick = () => {
    const x = prompt("Enter secret passcode:");

    if (x === key) {
        u = true;
        g = false;
        b.style.display = "none";

        setTimeout(() => u = false, 10000);
    } else {
        l = Date.now() + 30 * 60 * 1000;
        block();
    }
};

})();
</script>

</body>
</html>
