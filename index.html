<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Money Game</title>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;overflow:hidden;color:#fff;background:linear-gradient(to bottom,#1db954,#0b6623)}
.animal-btn{position:fixed;background:transparent;border:0;font-size:110px;cursor:pointer;z-index:9999;user-select:none}
.elephant{bottom:20px;left:20px}
.monkey{top:20px;left:20px;font-size:90px}
.giraffe{top:20px;right:20px;font-size:140px}
.tiger{bottom:20px;right:20px}
.center{position:relative;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:15px}
.money-controls{display:flex;gap:10px}
button{padding:12px 20px;font-size:18px;border:0;border-radius:10px;cursor:pointer}
.action{background:#2ecc71;color:#fff}
#warningScreen{position:fixed;inset:0;background:red;color:#fff;display:none;align-items:center;justify-content:center;font-size:40px;font-weight:bold;z-index:99999}
</style>
</head>

<body>

<div id="warningScreen">⚠️ UNLOCK FIRST! ⚠️</div>

<button class="animal-btn tiger" onclick="a('t')">🐯</button>
<button class="animal-btn monkey" onclick="a('m')">🐒</button>
<button class="animal-btn elephant" onclick="a('e')">🐘</button>
<button class="animal-btn giraffe" onclick="a('g')">🦒</button>

<div class="center">
<h1>💰 <span id="m">0</span></h1>
<div class="money-controls">
<button onclick="p()">+</button>
<button onclick="n()">-</button>
</div>
</div>

<script>
(()=>{

firebase.initializeApp({
apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
databaseURL:"https://YOUR_PROJECT-default-rtdb.firebaseio.com",
projectId:"YOUR_PROJECT"
});

const r=firebase.database().ref("shopMoney"),
m=document.getElementById("m"),
w=document.getElementById("warningScreen");

let u=0,f=0,p=[],g=0,l=0;

const o=["t","t","e"],k="G",
map={tiger:"t",monkey:"m",elephant:"e",giraffe:"g"};

r.on("value",s=>m.textContent=s.val()||0);

const w0=()=>{w.style.display="flex";setTimeout(()=>w.style.display="none",1200)},
l0=()=>Date.now()<l,
b0=()=>document.body.innerHTML=
`<div style="position:fixed;inset:0;background:#000;color:red;display:flex;align-items:center;justify-content:center;font-size:28px">🔒 LOCKED FOR 30 MINUTES 🔒</div>`;

window.p=()=>{
if(l0())return b0();
if(!u)return w0();
r.transaction(v=>(v||0)+1);
};

window.n=()=>{
if(l0())return b0();
if(!u)return w0();
r.transaction(v=>(v||0)-1);
};

window.a=x=>{
if(l0())return b0();
if(f||u||g)return;
if(map[Object.keys(map).find(z=>map[z]===x)]!==o[p.length])return f=1;
p.push(x);
if(p.length===o.length)h();
};

const b=document.createElement("button");
b.style.cssText="position:fixed;width:60px;height:60px;opacity:0;display:none;z-index:99999";
document.body.appendChild(b);

function h(){
g=1;
b.style.display="block";
b.style.left=Math.random()*(innerWidth-60)+"px";
b.style.top=Math.random()*(innerHeight-60)+"px";
}

b.onclick=()=>{
let x=prompt("Code:");
if(x===k){
u=1;g=0;b.style.display="none";
setTimeout(()=>u=0,10000);
}else{
l=Date.now()+1800000;
b0();
}
};

})();
</script>

</body>
</html>
