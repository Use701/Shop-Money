<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Money Game</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    overflow: hidden;
    color: white;
    background: linear-gradient(to bottom, #1db954, #0b6623);
}

/* ===== ANIMAL BUTTONS ===== */
.animal-btn {
    position: fixed;
    background: transparent;
    border: none;
    font-size: 110px;
    cursor: pointer;
    z-index: 9999;
    user-select: none;
}

.elephant {
    bottom: 20px;
    left: 20px;
}

.monkey {
    top: 20px;
    left: 20px;
    font-size: 90px;
}

.giraffe {
    top: 20px;
    right: 20px;
    font-size: 140px;
}

.tiger {
    bottom: 20px;
    right: 20px;
}

/* ===== UI ===== */
.center {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

.money-controls {
    display: flex;
    gap: 10px;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.action {
    background: #2ecc71;
    color: white;
}
</style>
</head>

<body>

<!-- 🐾 ANIMALS -->
<button class="animal-btn tiger" onclick="animalClick('tiger')">🐯</button>
<button class="animal-btn monkey" onclick="animalClick('monkey')">🐒</button>
<button class="animal-btn elephant" onclick="animalClick('elephant')">🐘</button>
<button class="animal-btn giraffe" onclick="animalClick('giraffe')">🦒</button>

<!-- UI -->
<div class="center">

    <h1>💰 Shop Money: <span id="money">0</span></h1>

    <div class="money-controls">
        <button onclick="increase()" class="action">+</button>
        <button onclick="decrease()" class="action">-</button>
    </div>

</div>

<script>
let unlocked = false;
let playerOrder = [];
let money = 0;

/* SECRET CODE */
const correctOrder = ["elephant", "monkey", "elephant"];

/* UPDATE MONEY */
function updateMoney() {
    document.getElementById("money").textContent = money;
}

/* RED SCREEN */
function showRedScreen(msg) {
    document.body.innerHTML = `
        <div style="
            position:fixed;
            inset:0;
            background:red;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:50px;
            font-weight:bold;
        ">
            ⚠️ ${msg} ⚠️
        </div>
    `;
}

/* + BUTTON */
function increase() {
    if (!unlocked) {
        showRedScreen("Unlock First");
        return;
    }

    money++;
    updateMoney();
}

/* - BUTTON */
function decrease() {
    if (!unlocked) {
        showRedScreen("Unlock First");
        return;
    }

    money--;
    updateMoney();
}

/* ANIMAL SEQUENCE */
function animalClick(animal) {

    const expected = correctOrder[playerOrder.length];

    // Ignore wrong clicks (no reset, no penalty)
    if (animal !== expected) {
        return;
    }

    playerOrder.push(animal);

    if (playerOrder.length === correctOrder.length) {
        unlocked = true;
        playerOrder = [];

        alert("✅ Correct order! You are unlocked for 10 seconds.");

        setTimeout(() => {
            unlocked = false;
        }, 10000);
    }
}

/* INIT */
updateMoney();
</script>

</body>
</html>
