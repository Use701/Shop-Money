<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Money Game</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    overflow: hidden;
    color: white;
    background: linear-gradient(to bottom, #1db954, #0b6623);
}

/* ===== ANIMAL BUTTONS ===== */
.animal-btn {
    position: fixed;
    background: transparent;
    border: none;
    font-size: 110px;
    cursor: pointer;
    z-index: 9999;
    user-select: none;
}

/* corners */
.tiger {
    bottom: 20px;
    right: 20px;
}

.elephant {
    bottom: 20px;
    left: 20px;
}

.giraffe {
    top: 20px;
    right: 20px;
    font-size: 140px;
}

.monkey {
    top: 20px;
    left: 20px;
    font-size: 90px;
}

/* ===== UI ===== */
.center {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
    z-index: 1;
}

.money-controls {
    display: flex;
    gap: 10px;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.action {
    background: #2ecc71;
    color: white;
}
</style>
</head>

<body>

<!-- 🐾 ANIMALS (REAL BUTTONS) -->
<button class="animal-btn tiger" onclick="animalClick('tiger')">🐯</button>
<button class="animal-btn monkey" onclick="animalClick('monkey')">🐒</button>
<button class="animal-btn elephant" onclick="animalClick('elephant')">🐘</button>
<button class="animal-btn giraffe" onclick="animalClick('giraffe')">🦒</button>

<!-- UI -->
<div class="center">

    <h1>💰 Shop Money: <span id="money">0</span></h1>

    <div class="money-controls">
        <button onclick="increase()" class="action">+</button>
        <button onclick="decrease()" class="action">-</button>
    </div>

</div>

<script>
let unlocked = false;
let lockUntil = 0;

/* ORDER */
const correctOrder = ["tiger", "elephant", "giraffe"];
let playerOrder = [];

/* MONEY */
let money = 0;

function updateMoney() {
    document.getElementById("money").textContent = money;
}

/* RED SCREEN */
function showRedScreen(msg) {
    document.body.innerHTML = `
        <div style="
            position:fixed;
            inset:0;
            background:red;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:40px;
            text-align:center;
        ">
        ⚠ ${msg}
        </div>
    `;
}

/* + - */
function increase() {
    if (!unlocked) return showRedScreen("Unlock first!");
    money++;
    updateMoney();
}

function decrease() {
    if (!unlocked) return showRedScreen("Unlock first!");
    money--;
    updateMoney();
}

/* ANIMALS */
function animalClick(animal) {

    if (animal === "monkey") {
        alert("🐒 distraction!");
        return;
    }

    playerOrder.push(animal);

    for (let i = 0; i < playerOrder.length; i++) {
        if (playerOrder[i] !== correctOrder[i]) {
            playerOrder = [];
            lockUntil = Date.now() + 30 * 60 * 1000;
            showRedScreen("Wrong order! Locked 30 minutes.");
            return;
        }
    }

    if (playerOrder.length === correctOrder.length) {
        unlocked = true;

        alert("✅ Correct order! You are unlocked for 10 seconds.");

        setTimeout(() => {
            unlocked = false;
        }, 10000);
    }
}

/* init */
updateMoney();
</script>

</body>
</html>
